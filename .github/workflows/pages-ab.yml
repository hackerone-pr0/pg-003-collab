name: pages-collab-ab
on:
  push:
    branches: [evil]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p _site && echo "<h1>COLLAB-ENVBYPASS-1791413590</h1>" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
  deploy-control-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
  deploy-bypass-loose:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: loose
    steps:
      - uses: actions/deploy-pages@v4
